# =============================================================================
# DOCKER COMPOSE - PC2 (MySQL + phpMyAdmin + PHP/Apache)
# =============================================================================
# Usar: docker compose -f docker-compose-pc2.yml up -d
# =============================================================================

version: '3.8'

services:
  # ==========================================
  # 1. MySQL (Base de Dados Relacional)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: pisid_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pisid_maze
      MYSQL_USER: aluno
      MYSQL_PASSWORD: aluno
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - pisid_network

  # ==========================================
  # 2. Servidor Web (Apache + PHP)
  # ==========================================
  web-php:
    image: php:8.2-apache
    container_name: pisid_web_php
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./html:/var/www/html
    depends_on:
      - mysql
    networks:
      - pisid_network

  # ==========================================
  # 3. Interface Web para o MySQL (phpMyAdmin)
  # ==========================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pisid_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: aluno
      PMA_PASSWORD: aluno
    depends_on:
      - mysql
    networks:
      - pisid_network

# ==========================================
# Redes e Volumes
# ==========================================
networks:
  pisid_network:
    driver: bridge

volumes:
  mysql_data:
